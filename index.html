<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo's Joint Finances</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101A2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoo's Finances">
<link rel="apple-touch-icon" href="icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --navy: #16233B; --navy-deep: #101A2C; --navy-light: #24365A;
    --gold: #C9A44C; --gold-bright: #E0BC66;
    --blush: #D9A6A0; --blush-bright: #E7BEB8; --blush-deep: #A8726C;
    --cream: #F8F3E9; --cream-dim: #EFE6D3;
    --ink: #2A2118; --ink-soft: #6b6252;
    --line: rgba(201,164,76,0.25);
    --good: #5B8C77; --warn: #B5673E; --danger: #A8433D;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter', sans-serif; background: var(--navy-deep); color: var(--cream); min-height:100vh; }
  .app{ display:flex; min-height:100vh; }

  .sidebar{ width:220px; flex-shrink:0; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); border-right: 1px solid var(--line); padding: 28px 18px; display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .brand{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; color:var(--gold-bright); letter-spacing:0.3px; line-height:1.25; }
  .sprig{ flex-shrink:0; opacity:0.85; }
  .brand-sub{ font-size:11px; color:var(--blush-bright); opacity:0.75; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:26px; font-style:italic; font-family:'Fraunces', serif; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:8px; color:var(--cream-dim); font-size:14px; cursor:pointer; margin-bottom:4px; border-left: 2px solid transparent; transition:all 0.15s; }
  .nav-item:hover{ background:rgba(217,166,160,0.06); }
  .nav-item.active{ background: linear-gradient(90deg, rgba(201,164,76,0.14), rgba(217,166,160,0.06)); border-left: 2px solid var(--blush); color: var(--gold-bright); }
  .nav-icon{ width:16px; text-align:center; font-size:14px; }
  .sidebar-footer{ margin-top:auto; font-size:11px; color:var(--cream-dim); opacity:0.5; line-height:1.6; }
  .user-chip{ font-size:11.5px; color:var(--cream-dim); opacity:0.85; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); line-height:1.6; }
  .user-chip a{ color:var(--blush-bright); cursor:pointer; text-decoration:underline; }
  .save-indicator{ font-size:11px; color:var(--blush-bright); opacity:0; transition:opacity 0.3s; margin-top:8px; display:flex; align-items:center; gap:5px; }
  .save-indicator.show{ opacity:0.85; }

  .main{ flex:1; padding:36px 44px; max-width:1020px; }
  .page-title{ font-family:'Fraunces', serif; font-size:27px; font-weight:600; color:var(--cream); margin:0; }
  .title-flourish{ width:60px; height:10px; opacity:0.7; margin:8px 0 6px 0; }
  .page-sub{ color:var(--cream-dim); opacity:0.6; font-size:13px; margin-bottom:26px; font-style:italic; font-family:'Fraunces', serif; }

  .banner{ background: rgba(168,67,61,0.15); border:1px solid var(--danger); color:#F4D9D9; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }

  .card{ background: var(--cream); color: var(--ink); border-radius:14px; padding:24px 26px; margin-bottom:20px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 8px 20px -14px rgba(16,26,44,0.35); position:relative; overflow:hidden; }
  .card::before{ content:''; position:absolute; top:0; left:0; width:100%; height:3px; background: linear-gradient(90deg, var(--gold), var(--blush) 85%); }
  .card-title{ font-family:'Fraunces', serif; font-size:17.5px; font-weight:600; font-style:italic; margin:0 0 16px 0; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .card-title::before{ content:''; width:6px; height:6px; border-radius:50%; background: var(--blush-deep); flex-shrink:0; }

  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  input, select{ width:100%; padding:9px 11px; border-radius:8px; border:1px solid rgba(0,0,0,0.15); background:#fff; font-family:'Inter', sans-serif; font-size:14px; color:var(--ink); }
  input:focus, select:focus{ outline:none; border-color: var(--blush-deep); box-shadow: 0 0 0 3px rgba(217,166,160,0.28); }
  .form-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:16px; }
  .form-grid.two{ grid-template-columns: repeat(2, 1fr); }
  .form-grid.three{ grid-template-columns: repeat(3, 1fr); }
  .full{ grid-column: 1 / -1; }
  button{ font-family:'Inter', sans-serif; font-weight:600; font-size:13px; padding:10px 20px; border-radius:8px; border:none; background: linear-gradient(135deg, var(--navy), var(--navy-light)); color: var(--gold-bright); cursor:pointer; transition: transform 0.1s, box-shadow 0.15s; }
  button:hover{ box-shadow: 0 0 0 3px rgba(217,166,160,0.18); }
  button:active{ transform: scale(0.98); }
  button.ghost{ background:transparent; border:1px solid rgba(0,0,0,0.15); color:var(--ink-soft); }
  button.ghost:hover{ background:rgba(217,166,160,0.08); box-shadow:none; }
  button.small{ padding:6px 12px; font-size:12px; }

  .toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .toolbar select, .toolbar input{ width:auto; min-width:150px; }
  .seg{ display:flex; background: var(--cream-dim); border-radius:8px; padding:3px; gap:2px; }
  .seg button{ background:transparent; color: var(--ink-soft); padding:7px 14px; font-weight:500; }
  .seg button.active{ background: var(--navy); color: var(--gold-bright); }
  .seg button:hover{ box-shadow:none; }

  .stat-row{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:20px; }
  .stat{ background:#fff; border-radius:10px; padding:14px 16px; border:1px solid rgba(0,0,0,0.06); }
  .stat.over{ border-color: var(--danger); background: rgba(168,67,61,0.06); }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin-bottom:6px; display:flex; align-items:center; gap:5px;}
  .stat-value{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--ink); }
  .stat-value.good{ color: var(--good); } .stat-value.warn{ color: var(--warn); } .stat-value.over{ color: var(--danger); }
  .flag{ color: var(--danger); font-size:13px; }

  .chart-row{ display:grid; grid-template-columns: 260px 1fr; gap:28px; align-items:center; }
  .chart-wrap{ position:relative; height:240px; }
  .legend{ display:flex; flex-direction:column; gap:8px; }
  .legend-item{ display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid rgba(0,0,0,0.06); }
  .legend-left{ display:flex; align-items:center; gap:9px; }
  .swatch{ width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .legend-cat{ color:var(--ink); font-weight:500; }
  .legend-amt{ font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); font-size:12.5px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid rgba(0,0,0,0.1); }
  td{ padding:9px 10px; border-bottom:1px solid rgba(0,0,0,0.06); color:var(--ink); }
  td.amt{ font-family:'IBM Plex Mono', monospace; text-align:right; }
  tr:hover td{ background:rgba(217,166,160,0.08); }

  .empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px; }
  .anything-box{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
  .anything-pair{ display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .limit-rows{ display:flex; flex-direction:column; gap:10px; }
  .limit-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-radius:10px; border:1px solid rgba(0,0,0,0.06); }
  .limit-row.over{ border-color: var(--danger); background: rgba(168,67,61,0.06); }
  .limit-name{ font-weight:600; display:flex; align-items:center; gap:8px; min-width:150px; flex-shrink:0; }
  .limit-detail{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }
  .limit-detail.over{ color: var(--danger); font-weight:600; }
  .progress-bar{ height:8px; border-radius:4px; background: var(--cream-dim); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:4px; transition:width 0.2s; }

  .access-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#fff; border-radius:10px; border:1px solid rgba(0,0,0,0.06); margin-bottom:8px; }

  .gate-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background: radial-gradient(circle at 30% 20%, var(--navy-light), var(--navy-deep) 70%); padding:20px; }
  .gate-card{ background: var(--cream); color: var(--ink); border-radius:16px; padding:38px 36px; max-width:400px; width:100%; text-align:center; box-shadow: 0 20px 60px -20px rgba(0,0,0,0.5); }
  .gate-title{ font-family:'Fraunces', serif; font-size:24px; font-weight:600; margin-bottom:8px; }
  .gate-sub{ font-size:13.5px; color:var(--ink-soft); margin-bottom:24px; line-height:1.5; }
  .google-btn{ width:100%; background:#fff; color:#3c4043; border:1px solid rgba(0,0,0,0.2); padding:11px; border-radius:8px; font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .google-btn:hover{ box-shadow:0 1px 4px rgba(0,0,0,0.2); }

  @media (max-width: 800px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:14px; align-items:center; }
    .brand-row, .brand-sub, .sidebar-footer, .save-indicator, .user-chip{ display:none; }
    .nav-item{ margin-bottom:0; white-space:nowrap; }
    .main{ padding:20px; }
    .form-grid, .stat-row, .anything-box{ grid-template-columns: repeat(2,1fr); }
    .form-grid.three{ grid-template-columns: repeat(2,1fr); }
    .chart-row, .anything-pair{ grid-template-columns: 1fr; }
    .limit-row{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div id="gate-screen" style="display:none;"></div>

<div class="app" id="app-shell" style="display:none;">
  <div class="sidebar">
    <div class="brand-row">
      <svg class="sprig" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21V9" stroke="#E0BC66" stroke-width="1.4" stroke-linecap="round"/><path d="M12 13c0-4 3-6 7-6-1 4-3 6-7 6z" fill="#D9A6A0" opacity="0.85"/><path d="M12 17c0-3.2-2.4-5-5.6-5C7.2 15.4 9 17 12 17z" fill="#C9A44C" opacity="0.85"/></svg>
      <div class="brand">Zoo's Joint<br>Finances</div>
    </div>
    <div class="brand-sub">shared ledger</div>

    <div class="nav-item active" data-tab="add"><span class="nav-icon">✎</span> Add entry</div>
    <div class="nav-item" data-tab="monthly"><span class="nav-icon">◐</span> Monthly</div>
    <div class="nav-item" data-tab="yearly"><span class="nav-icon">▤</span> Yearly</div>
    <div class="nav-item" data-tab="income"><span class="nav-icon">$</span> Income</div>
    <div class="nav-item" data-tab="budgets"><span class="nav-icon">◧</span> Budgets</div>
    <div class="nav-item" data-tab="settings"><span class="nav-icon">⚙</span> Settings</div>

    <div class="sidebar-footer">Entries sync automatically, in real time.</div>
    <div class="save-indicator" id="save-indicator">✧ saved</div>
    <div class="user-chip" id="user-chip"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
const CATEGORIES = [
  { id:'rent', label:'Rent', color:'#C9A44C' },
  { id:'car', label:'Car expenses', color:'#7C9A92' },
  { id:'groceries', label:'Groceries', color:'#5B8C77' },
  { id:'gas', label:'Gas', color:'#C08552' },
  { id:'eatingout', label:'Eating out', color:'#B5673E' },
  { id:'coffee', label:'Coffee / matcha', color:'#8C6A4E' },
  { id:'household', label:'Household', color:'#4C6B8A' },
  { id:'personalcare', label:'Personal care', color:'#9B6B8C' },
  { id:'healthcare', label:'Healthcare', color:'#6FA39A' },
  { id:'utilities', label:'Utilities', color:'#6B8AA8' },
  { id:'streaming', label:'Streaming subscriptions', color:'#A87C4C' },
  { id:'pets', label:'Pets', color:'#7A8C4C' },
  { id:'anything', label:'Anything', color:'#DDBB6E' },
];
const catById = id => CATEGORIES.find(c => c.id === id);
const NON_ANYTHING_CATS = CATEGORIES.filter(c => c.id !== 'anything');
const BOTH = 'Both';

const todayISO = () => new Date().toISOString().slice(0,10);
const thisMonth = () => new Date().toISOString().slice(0,7);
const thisYear = () => new Date().getFullYear();
const fmt = n => '$' + (Math.round((n||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
const monthLabel = m => { const [y,mo]=m.split('-'); return new Date(y, mo-1, 1).toLocaleString('default',{month:'long', year:'numeric'}); };

function defaultSettings(){
  return {
    name1:'Partner 1', name2:'Partner 2',
    startMonth: thisMonth(),
    anythingBudgets: {},   // { [personName]: monthly amount }
    categoryBudgets: {},   // { [categoryId]: monthly amount }  (all categories except "anything")
    income: {}
  };
}
let appData = { entries: [], settings: defaultSettings() };
let dataLoaded = false;

let ui = { tab: 'add', monthlyMonth: thisMonth(), monthlyPerson: 'combined', yearlyYear: thisYear(), yearlyPerson: 'combined' };

// =====================================================================
// FIREBASE SETUP — fill these in (see the setup instructions you were given)
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyAKf91h-lBCyZOcpWTdmeePSJ7UFUUoerY",
  authDomain: "financial-planner-786d1.firebaseapp.com",
  projectId: "financial-planner-786d1",
  storageBucket: "financial-planner-786d1.firebasestorage.app",
  messagingSenderId: "591365805551",
  appId: "1:591365805551:web:c5606a73c65cdc84da921a"
};
// This email always has access, even before it's added to the invite list below.
// Must exactly match the email string in your Firestore security rules.
const INITIAL_ADMIN_EMAIL = "nathancwoo4@gmail.com";
// =====================================================================

let db = null, firebaseReady = false;
try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
}catch(e){ console.error('Firebase init failed', e); }

let authUser = null;
let allowedEmails = [];
let accessLoaded = false;
let ledgerUnsub = null, accessUnsub = null;

// ---------- persistence ----------
let saveQueue = Promise.resolve();
function saveData(){
  showSaving();
  if(!firebaseReady) return Promise.resolve();
  saveQueue = saveQueue
    .then(()=> db.collection('ledger').doc('shared-data').set(JSON.parse(JSON.stringify(appData))))
    .then(()=> db.collection('ledger_backups').add({ timestamp: Date.now(), entries: appData.entries, settings: appData.settings }))
    .catch(e=> console.error('Ledger: save failed', e));
  return saveQueue;
}
function showSaving(){
  const ind = document.getElementById('save-indicator');
  if(!ind) return;
  ind.classList.add('show');
  clearTimeout(showSaving._t);
  showSaving._t = setTimeout(()=> ind.classList.remove('show'), 1200);
}

function startLedgerSync(){
  if(ledgerUnsub) return;
  ledgerUnsub = db.collection('ledger').doc('shared-data').onSnapshot(doc=>{
    if(doc.exists){
      const parsed = doc.data();
      appData = { entries: Array.isArray(parsed.entries) ? parsed.entries : [], settings: Object.assign(defaultSettings(), parsed.settings||{}) };
      appData.settings.anythingBudgets = appData.settings.anythingBudgets || {};
      appData.settings.categoryBudgets = appData.settings.categoryBudgets || {};
      appData.settings.income = appData.settings.income || {};
    }
    dataLoaded = true;
    renderGate();
  }, err=>{ console.error('Ledger: sync error', err); dataLoaded = true; renderGate(); });
}

function startAccessSync(){
  if(accessUnsub) return;
  accessUnsub = db.collection('access').doc('allowed').onSnapshot(doc=>{
    allowedEmails = (doc.exists && doc.data().emails) || [];
    accessLoaded = true;
    renderGate();
  }, err=>{ console.error('Access: sync error', err); accessLoaded = true; renderGate(); });
}

function addAllowedEmail(email){
  email = (email||'').trim().toLowerCase();
  if(!email) return;
  db.collection('access').doc('allowed').set({
    emails: firebase.firestore.FieldValue.arrayUnion(email)
  }, { merge:true }).catch(e=>console.error(e));
}
function removeAllowedEmail(email){
  db.collection('access').doc('allowed').set({
    emails: firebase.firestore.FieldValue.arrayRemove(email)
  }, { merge:true }).catch(e=>console.error(e));
}

function signIn(){
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(e=>{
    console.error('Sign-in failed', e);
    alert('Sign-in failed: ' + e.message);
  });
}
function signOutUser(){ firebase.auth().signOut(); }

function initAuth(){
  if(!firebaseReady){ dataLoaded = true; accessLoaded = true; renderGate(); return; }
  firebase.auth().onAuthStateChanged(user=>{
    authUser = user;
    if(user){ startLedgerSync(); startAccessSync(); }
    renderGate();
  });
}

// ---------- backups ----------
function exportData(){
  const blob = new Blob([JSON.stringify(appData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `zoo-finances-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.entries) || typeof parsed.settings !== 'object') throw new Error('Unrecognized file format');
      if(!confirm('This will replace all current data with the contents of this file. Continue?')) return;
      appData = { entries: parsed.entries, settings: Object.assign(defaultSettings(), parsed.settings) };
      saveData();
      render();
    }catch(e){ alert('Could not read that file: ' + e.message); }
  };
  reader.readAsText(file);
}
function listBackups(container){
  if(!firebaseReady){ container.innerHTML = '<div class="empty">Connect Firebase to enable version history.</div>'; return; }
  db.collection('ledger_backups').orderBy('timestamp','desc').limit(20).get().then(snap=>{
    if(snap.empty){ container.innerHTML = '<div class="empty">No backups yet — they appear automatically as you use the app.</div>'; return; }
    container.innerHTML = snap.docs.map(doc=>{
      const d = doc.data();
      return `<div class="access-row"><span>${new Date(d.timestamp).toLocaleString()}</span><button class="small ghost" data-restore="${doc.id}">Restore this version</button></div>`;
    }).join('');
    container.querySelectorAll('[data-restore]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!confirm('Restore the ledger to this earlier version? Your current data will be replaced (though it will also be backed up first).')) return;
        db.collection('ledger_backups').doc(btn.dataset.restore).get().then(doc=>{
          const d = doc.data();
          appData = { entries: d.entries||[], settings: Object.assign(defaultSettings(), d.settings||{}) };
          saveData();
          render();
        });
      });
    });
  }).catch(e=>{ container.innerHTML = '<div class="empty">Could not load backups.</div>'; console.error(e); });
}

function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function switchTab(tab){ ui.tab = tab; render(); }

// ---------- computation helpers ----------
function entriesFor({month, year, person}){
  return appData.entries.filter(e=>{
    if(month && e.date.slice(0,7) !== month) return false;
    if(year && e.date.slice(0,4) !== String(year)) return false;
    if(person && person !== 'combined'){ if(e.person !== person && e.person !== BOTH) return false; }
    return true;
  });
}
function categoryTotals(list){
  const totals = {};
  CATEGORIES.forEach(c => totals[c.id] = 0);
  list.forEach(e => { totals[e.category] = (totals[e.category]||0) + Number(e.amount); });
  return totals;
}
function incomeFor(){
  const inc = appData.settings.income || {};
  return (Number(inc[appData.settings.name1])||0) + (Number(inc[appData.settings.name2])||0);
}
function allMonthsBetween(start, end){
  const months = [];
  let [sy,sm] = start.split('-').map(Number);
  let [ey,em] = end.split('-').map(Number);
  let y=sy, m=sm, guard=0;
  while((y < ey || (y===ey && m<=em)) && guard < 1200){
    months.push(`${y}-${String(m).padStart(2,'0')}`);
    m++; if(m>12){m=1;y++;}
    guard++;
  }
  return months;
}
// per-person "anything" rollover — solo entries count fully, "Both" entries split 50/50
function personAnythingRollover(person, uptoMonth){
  const allotted = Number(appData.settings.anythingBudgets[person]) || 0;
  const start = appData.settings.startMonth || uptoMonth;
  if(uptoMonth < start) return { rollover:0, spentThisMonth:0, allotted };
  const months = allMonthsBetween(start, uptoMonth);
  let rollover = 0, spentThisMonth = 0;
  months.forEach(m=>{
    const spent = appData.entries.filter(e=>e.category==='anything' && e.date.slice(0,7)===m)
      .reduce((s,e)=>{
        if(e.person===person) return s + Number(e.amount);
        if(e.person===BOTH) return s + Number(e.amount)/2;
        return s;
      }, 0);
    if(m === uptoMonth) spentThisMonth = spent;
    rollover += (allotted - spent);
  });
  return { rollover, spentThisMonth, allotted };
}
function personAnythingYear(person, year){
  const decOrNow = `${year}-12` > thisMonth() ? thisMonth() : `${year}-12`;
  const roll = personAnythingRollover(person, decOrNow);
  const spentYear = appData.entries.filter(e=>e.category==='anything' && e.date.slice(0,4)===String(year))
    .reduce((s,e)=>{
      if(e.person===person) return s + Number(e.amount);
      if(e.person===BOTH) return s + Number(e.amount)/2;
      return s;
    }, 0);
  return { allotted: roll.allotted*12, spentYear, rollover: roll.rollover };
}
function categoryBudgetRows(totals, multiplier){
  return NON_ANYTHING_CATS.map(c=>{
    const budget = (Number(appData.settings.categoryBudgets[c.id])||0) * multiplier;
    const spent = totals[c.id] || 0;
    return { cat:c, budget, spent };
  }).filter(r => r.budget > 0);
}

// ---------- gate: sign-in / access / app ----------
function renderGate(){
  const gate = document.getElementById('gate-screen');
  const shell = document.getElementById('app-shell');

  if(!firebaseReady){
    gate.style.display = 'none';
    shell.style.display = 'flex';
    dataLoaded = true;
    render();
    return;
  }

  if(!authUser){
    shell.style.display = 'none';
    gate.style.display = 'block';
    gate.innerHTML = `<div class="gate-wrap"><div class="gate-card">
      <div class="gate-title">Zoo's Joint Finances</div>
      <div class="gate-sub">Sign in with the Google account you use to access this ledger.</div>
      <button class="google-btn" id="gate-signin">Sign in with Google</button>
    </div></div>`;
    document.getElementById('gate-signin').addEventListener('click', signIn);
    return;
  }

  if(!accessLoaded){
    shell.style.display = 'none';
    gate.style.display = 'block';
    gate.innerHTML = `<div class="gate-wrap"><div class="gate-card"><div class="gate-title">Loading…</div></div></div>`;
    return;
  }

  const email = (authUser.email||'').toLowerCase();
  const allowed = email === INITIAL_ADMIN_EMAIL.toLowerCase() || allowedEmails.includes(email);

  if(!allowed){
    shell.style.display = 'none';
    gate.style.display = 'block';
    gate.innerHTML = `<div class="gate-wrap"><div class="gate-card">
      <div class="gate-title">Access restricted</div>
      <div class="gate-sub">${authUser.email} isn't on the invite list yet. Ask whoever manages this ledger to add your Google account in Settings → Access.</div>
      <button class="ghost" id="gate-signout">Sign out</button>
    </div></div>`;
    document.getElementById('gate-signout').addEventListener('click', signOutUser);
    return;
  }

  if(!dataLoaded){
    shell.style.display = 'none';
    gate.style.display = 'block';
    gate.innerHTML = `<div class="gate-wrap"><div class="gate-card"><div class="gate-title">Loading your ledger…</div></div></div>`;
    return;
  }

  gate.style.display = 'none';
  shell.style.display = 'flex';
  const chip = document.getElementById('user-chip');
  if(chip) chip.innerHTML = `Signed in as ${authUser.email}<br><a id="signout-link">Sign out</a>`;
  const signoutLink = document.getElementById('signout-link');
  if(signoutLink) signoutLink.addEventListener('click', signOutUser);
  render();
}

// ---------- main render dispatch ----------
function render(){
  const main = document.getElementById('main');
  if(!main) return;
  document.querySelectorAll('.nav-item').forEach(n=> n.classList.toggle('active', n.dataset.tab === ui.tab));
  main.innerHTML = '';
  if(!firebaseReady){
    main.appendChild(el(`<div class="banner">⚠ This ledger isn't connected to a database yet, so nothing will be saved or synced. Add your Firebase config near the top of the script.</div>`));
  }
  try{
    if(ui.tab==='add'){ main.appendChild(buildAdd()); }
    else if(ui.tab==='monthly'){ const {node, post} = buildMonthly(); main.appendChild(node); post(); }
    else if(ui.tab==='yearly'){ const {node, post} = buildYearly(); main.appendChild(node); post(); }
    else if(ui.tab==='income'){ main.appendChild(buildIncome()); }
    else if(ui.tab==='budgets'){ main.appendChild(buildBudgets()); }
    else if(ui.tab==='settings'){ main.appendChild(buildSettings()); }
  }catch(err){
    console.error('Render error', err);
    main.innerHTML += `<div class="page-title">Something went sideways</div><div class="banner">This tab hit an error: ${(err && err.message) || err}.</div>`;
  }
}

function budgetRowsHTML(rows){

function anythingCardsHTML(status1, status2, name1, name2){
  const card = (name, st) => {
    const remain = st.allotted - (st.spentThisMonth!==undefined ? st.spentThisMonth : st.spentYear);
    const over = remain < 0;
    return `<div class="card" style="margin-bottom:0;">

      <div class="anything-box">

  function renderAccessList(){
    const list = wrap.querySelector('#access-list');
    const rows = [`<div class="access-row"><span>${INITIAL_ADMIN_EMAIL} (admin, always allowed)</span></div>`]
      .concat(allowedEmails.map(email => `<div class="access-row"><span>${email}</span><button class="small ghost" data-remove="${email}">Remove</button></div>`));
    list.innerHTML = rows.join('');
    list.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=> removeAllowedEmail(btn.dataset.remove));
    });
  }
  renderAccessList();
  wrap.querySelector('#access-add').addEventListener('click', ()=>{
    const input = wrap.querySelector('#access-new-email');
    if(input.value.trim()){ addAllowedEmail(input.value); input.value=''; }
  });

  wrap.querySelector('#data-export').addEventListener('click', exportData);
  wrap.querySelector('#data-import').addEventListener('click', ()=> wrap.querySelector('#data-import-file').click());
  wrap.querySelector('#data-import-file').addEventListener('change', (e)=>{
    if(e.target.files[0]) importDataFromFile(e.target.files[0]);
  });
  listBackups(wrap.querySelector('#backup-list'));

  return wrap;
}

// ---------- charts ----------
let chartInstances = {};
function drawDonut(canvas, totals, total){
  if(!canvas) return;
  const id = canvas.id;
  if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; }
  const cats = CATEGORIES.filter(c => totals[c.id] > 0);
  if(cats.length===0) return;
  chartInstances[id] = new Chart(canvas, {
    type:'doughnut',
    data:{ labels: cats.map(c=>c.label), datasets:[{ data: cats.map(c=>totals[c.id]), backgroundColor: cats.map(c=>c.color), borderColor: '#F8F3E9', borderWidth: 2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: ctx => `${ctx.label}: ${fmt(ctx.parsed)} (${Math.round(ctx.parsed/total*1000)/10}%)` } } } }
  });
}
function legendHTML(totals, total){
  const cats = CATEGORIES.filter(c=>totals[c.id]>0).sort((a,b)=>totals[b.id]-totals[a.id]);
  if(cats.length===0) return '<div class="empty">No spending recorded for this period.</div>';
  return cats.map(c=>{
    const pct = total>0 ? Math.round(totals[c.id]/total*1000)/10 : 0;
    return `<div class="legend-item"><div class="legend-left"><span class="swatch" style="background:${c.color}"></span><span class="legend-cat">${c.label}</span></div><span class="legend-amt">${fmt(totals[c.id])} · ${pct}%</span></div>`;
  }).join('');
}

document.querySelectorAll('.nav-item').forEach(item=> item.addEventListener('click', ()=> switchTab(item.dataset.tab)));

initAuth();
</script>
